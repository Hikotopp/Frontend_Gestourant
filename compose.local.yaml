name: gestourant-local

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app

  backend:
    build:
      context: ../Backend_Gestourant
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8081"
      DB_URL: "jdbc:mysql://mysql:3306/gestourant_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8"
      DB_USERNAME: gestourant_local
      DB_PASSWORD: gestourant-local-only
      JWT_SECRET: gestourant-local-only-signing-secret-do-not-use-in-production
      ADMIN_REGISTRATION_CODE: gestourant-local-admin-only
      FRONTEND_URL: http://localhost:8080
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      APP_BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      APP_BACKUP_LOCAL_DIRECTORY: /app/backups
      APP_BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      APP_BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      APP_BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-gestourant/backups}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      APP_BACKUP_MYSQLDUMP_COMMAND: mysqldump
      APP_BACKUP_MYSQL_COMMAND: mysql
      LOG_FILE: /app/logs/gestourant.log
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0 -Duser.timezone=America/Bogota
    expose:
      - "8081"
    volumes:
      - backend_logs:/app/logs
      - backup_data:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/api/auth/config >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - app
      - data

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: gestourant_local
      MYSQL_USER: gestourant_local
      MYSQL_PASSWORD: gestourant-local-only
      MYSQL_ROOT_PASSWORD: gestourant-local-root-only
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysqladmin ping --protocol=TCP --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - data

networks:
  app:
  data:

volumes:
  backend_logs:
  backup_data:
  mysql_data:
